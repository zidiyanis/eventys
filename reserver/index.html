<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Eventys · Compose ta location</title>
<meta name="description" content="Choisis ta date et ton mobilier, Eventys te répond avec un devis.">
<meta name="theme-color" content="#F6F2F0">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="/gestion/icone-192.png">
<link rel="apple-touch-icon" href="/gestion/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F2F0; --sheet:#FBF8F6; --card:#FFFFFF; --card2:#EDE6E2; --line:#E2D8D3; --ink:#2A1A18; --muted:#7A6A66;
  --accent:#6F2F2F; --accent-ink:#FFFFFF; --red:#AF4444; --good:#2F7D55; --warn:#9A6414; --bad:#B3362E;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --display:'Bodoni Moda','Didot',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--ink)}
h1,h2,p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 190px max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top img{width:48px;height:48px;border-radius:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 34px/1.05 var(--display);letter-spacing:-.01em;margin:4px 0 6px}
.lead{color:var(--muted)}
.sec{font-size:13px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;margin:26px 0 10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.inp{height:50px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px;width:100%;min-width:0;font-size:16px}
textarea.inp{height:90px;padding:12px;resize:vertical}
.inp:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:12px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.qchips{display:flex;gap:6px;flex-wrap:wrap}
.qchips button{padding:9px 14px;border-radius:99px;background:var(--card2);font-weight:600;font-size:14px}
.qchips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:520px){.grid{grid-template-columns:1fr 1fr 1fr}}
.cc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.cc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ph{aspect-ratio:4/3;background:var(--card2);display:grid;place-items:center;color:var(--muted);font:700 28px var(--display)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb .n{font-weight:600;font-size:14px;line-height:1.25}
.cb .p{font-size:13px;color:var(--muted)}
.cb .p b{color:var(--ink)}
.left{font-size:12px;font-weight:600;color:var(--warn)}
.step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:auto}
.step button{width:44px;height:42px;font-size:22px;color:var(--accent);text-align:center}
.step button:disabled{opacity:.3;cursor:default}
.step b{min-width:30px;text-align:center}
.tip{font-size:13px;border-radius:12px;padding:10px 12px;font-weight:500;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);margin-top:10px}
.tip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:18px}
.sm{font-size:13px}.mut{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-ink);width:100%;text-decoration:none}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.done{text-align:center;padding-top:40px}
.done h1{margin:18px 0 10px}
.recap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;margin:18px 0;white-space:pre-wrap;font-size:14px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="mut" style="padding:40px 0;text-align:center">Chargement…</div></main>
<div class="bar" id="bar" hidden></div>
<script src="/gestion/catalogue.js"></script>
<script>
(function(){
'use strict';
/* Page client : le visiteur compose sa demande, elle arrive dans l'app de Yanis
   (« À traiter »). Il ne voit jamais les réservations des autres : seulement le
   stock restant pour sa date. Clé publique Supabase, faite pour être visible. */
var SB='https://qtktxkolgxytroblylae.supabase.co',KEY='sb_publishable_Wf4Qc4XkVxI9-5fnFoRoVg_1Yir0Jlt',WA='33783825638';
var CAT=window.EV_CAT,ITEMS=CAT.items;
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var today=iso(new Date()),maxD=(function(){var d=new Date();d.setDate(d.getDate()+730);return iso(d)})();
var S={date:'',mode:'livraison',items:{},nom:'',tel:'',ville:'',note:'',tarifs:{hiver:false,livPub:false,livMin:60},dispo:null,busy:false,err:'',sent:null};
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var eur=function(n){return Math.round(n).toLocaleString('fr-FR')+' €'};
var price=function(it){return it.k==='chaise'&&S.tarifs.hiver?CAT.hiverChaise:it.p};
var loc=function(){return ITEMS.reduce(function(t,it){return t+(S.items[it.k]||0)*price(it)},0)};
var count=function(){return ITEMS.reduce(function(t,it){return t+(S.items[it.k]||0)},0)};
var left=function(it){if(!it.stock)return null;if(!S.dispo)return it.stock;return Math.max(0,it.stock-(S.dispo[it.k]||0))};
function rpc(fn,args){return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})})
  .then(function(r){return r.text().then(function(t){var j=t?JSON.parse(t):null;if(!r.ok)throw new Error(j&&j.message||('HTTP '+r.status));return j})})}
var fdate=function(s){return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})};

function card(it){
  var q=S.items[it.k]||0,l=left(it),max=l===null?500:l;
  return '<div class="cc'+(q?' on':'')+'"><div class="ph">'+(it.img?'<img src="/assets/img/'+it.img+'" alt="'+esc(it.n)+'" loading="lazy">':esc(it.n.charAt(0)))+'</div>'
   +'<div class="cb"><div><div class="n">'+esc(it.n)+'</div><div class="p"><b>'+eur(price(it))+'</b>'+(it.s?' · '+esc(it.s):'')+'</div>'
   +(S.date&&l!==null&&l<it.stock?'<div class="left">'+(l?'Plus que '+l+' ce jour-là':'Complet ce jour-là')+'</div>':'')+'</div>'
   +'<div class="step"><button data-a="step" data-k="'+it.k+'" data-d="-1" '+(q?'':'disabled')+' aria-label="Retirer">−</button><b>'+q+'</b><button data-a="step" data-k="'+it.k+'" data-d="1" '+(q>=max?'disabled':'')+' aria-label="Ajouter">+</button></div></div></div>';
}
function render(){
  if(S.sent){
    var msg='Bonjour, je viens d’envoyer une demande sur ton site pour le '+fdate(S.sent.date)+' ('+S.sent.txt+').';
    $('#app').innerHTML='<div class="done"><img src="/gestion/icone-192.png" alt="" width="72" height="72" style="border-radius:18px"><h1>Demande envoyée</h1><p class="mut">Merci '+esc(S.sent.nom)+' ! Eventys la reçoit tout de suite et te répond avec un devis, en général dans la journée. Rien n’est réservé avant sa confirmation.</p>'
     +'<div class="recap">'+esc(S.sent.recap)+'</div><a class="btn" href="https://wa.me/'+WA+'?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">Prévenir Eventys sur WhatsApp</a>'
     +'<p class="sm mut" style="margin-top:12px">Facultatif : ta demande est déjà arrivée.</p></div>';
    $('#bar').hidden=true;return;
  }
  var chair=S.items.chaise||0,L=S.mode==='livraison';
  var h='<div class="top"><img src="/gestion/icone-192.png" alt="Eventys"><div><div class="eyebrow">Eventys · location de mobilier</div></div></div>'
   +'<h1>Compose ta location</h1><p class="lead">Choisis ta date, touche + sur ce qu’il te faut. Tu vois le prix tout de suite.</p>'
   +'<div class="sec">Ta date</div><div class="field"><label for="f-date">Date de l’événement</label><input class="inp" type="date" id="f-date" min="'+today+'" max="'+maxD+'" value="'+S.date+'"></div>'
   +'<div class="seg"><button data-a="mode" data-v="livraison" aria-pressed="'+L+'">Je souhaite être livré</button><button data-a="mode" data-v="retrait" aria-pressed="'+!L+'">Je viens au box</button></div>'
   +(L?'':'<p class="sm mut" style="margin-top:8px">Retrait au box à Soisy-sous-Montmorency (95), gratuit.</p>')
   +'<div class="sec">Ton mobilier</div><div class="field"><label>Chaises, en un tap</label><div class="qchips">'+[10,20,30,40,50,60,80,100].map(function(n){return '<button data-a="q" data-n="'+n+'" aria-pressed="'+(chair===n)+'">'+n+'</button>'}).join('')+'</div></div>'
   +'<div class="grid">'+ITEMS.map(card).join('')+'</div>'
   +'<div class="sec">Tes coordonnées</div>'
   +'<div class="field"><label for="f-nom">Prénom et nom</label><input class="inp" id="f-nom" autocomplete="name" maxlength="80" value="'+esc(S.nom)+'"></div>'
   +'<div class="field"><label for="f-tel">Téléphone (WhatsApp de préférence)</label><input class="inp" id="f-tel" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" placeholder="06 00 00 00 00" value="'+esc(S.tel)+'"></div>'
   +(L?'<div class="field"><label for="f-ville">Ville de livraison</label><input class="inp" id="f-ville" autocomplete="address-level2" maxlength="80" placeholder="Ex. Sarcelles" value="'+esc(S.ville)+'"></div>':'')
   +'<div class="field"><label for="f-note">Une précision ? (facultatif)</label><textarea class="inp" id="f-note" maxlength="300" placeholder="Type d’événement, étage, horaire souhaité…">'+esc(S.note)+'</textarea></div>'
   +'<input class="hp" id="f-hp" tabindex="-1" autocomplete="off" aria-hidden="true">'
   +(S.err?'<div class="tip bad" role="alert">'+esc(S.err)+'</div>':'');
  $('#app').innerHTML=h;
  var est=loc()+(L&&S.tarifs.livPub?S.tarifs.livMin:0);
  $('#bar').hidden=false;
  $('#bar').innerHTML='<div class="in"><div class="tot"><span>'+(L&&!S.tarifs.livPub?'Location (hors livraison)':'Estimation')+'</span><span>'+(L&&S.tarifs.livPub?'dès ':'')+eur(est)+'</span></div>'
   +'<div class="sm mut">'+(L?(S.tarifs.livPub?'Livraison à partir de '+eur(S.tarifs.livMin)+'. ':'Livraison : prix confirmé par Eventys selon ton adresse. '):'Retrait au box : gratuit. ')+'Rien n’est réservé avant sa confirmation.</div>'
   +'<button class="btn" data-a="send" '+(S.busy?'disabled':'')+'>'+(S.busy?'Envoi…':'Envoyer ma demande')+'</button></div>';
}
function loadDispo(){
  var d=S.date;if(!d){S.dispo=null;render();return}
  rpc('dispo',{p_date:d}).then(function(j){if(S.date===d){S.dispo=j||{};
    ITEMS.forEach(function(it){var l=left(it);if(l!==null&&(S.items[it.k]||0)>l)S.items[it.k]=l});render()}}).catch(function(){S.dispo=null;render()});
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
  if(a==='mode'){S.mode=b.dataset.v;render()}
  else if(a==='q'){var it=ITEMS[0],l=left(it);S.items.chaise=l===null?+b.dataset.n:Math.min(+b.dataset.n,l);render()}
  else if(a==='step'){var k=b.dataset.k,itm=ITEMS.filter(function(i){return i.k===k})[0],lim=left(itm);var v=Math.max(0,(S.items[k]||0)+(+b.dataset.d));if(lim!==null)v=Math.min(v,lim);S.items[k]=v;render()}
  else if(a==='send')send();
});
document.addEventListener('input',function(e){var id=e.target.id,v=e.target.value;
  if(id==='f-nom')S.nom=v;else if(id==='f-tel')S.tel=v;else if(id==='f-ville')S.ville=v;else if(id==='f-note')S.note=v;
  else if(id==='f-date'){S.date=v;loadDispo()}});
function send(){
  if(S.busy)return;S.err='';
  var digits=S.tel.replace(/\D/g,'');
  if($('#f-hp')&&$('#f-hp').value){S.sent={nom:S.nom,date:S.date,txt:'',recap:''};render();return}
  if(!S.date||S.date<today)S.err='Choisis la date de ton événement.';
  else if(!count())S.err='Ajoute au moins un article avec le bouton +.';
  else if(!S.nom.trim())S.err='Indique ton prénom.';
  else if(digits.length<9)S.err='Indique un numéro de téléphone valide.';
  else if(S.mode==='livraison'&&!S.ville.trim())S.err='Indique la ville de livraison.';
  if(S.err){render();var el=document.querySelector('.tip.bad');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return}
  var items={};ITEMS.forEach(function(it){if(S.items[it.k])items[it.k]=S.items[it.k]});
  S.busy=true;render();
  rpc('demande_client',{p_nom:S.nom.trim(),p_tel:S.tel.trim(),p_date:S.date,p_mode:S.mode,p_ville:S.mode==='livraison'?S.ville.trim():'',p_items:items,p_note:S.note.trim()})
   .then(function(){
     var lines=ITEMS.filter(function(it){return items[it.k]}).map(function(it){return items[it.k]+' × '+it.n});
     S.sent={nom:S.nom.trim().split(' ')[0],date:S.date,txt:lines.join(', '),
       recap:cap(fdate(S.date))+'\n'+lines.join('\n')+'\n'+(S.mode==='livraison'?'Livraison à '+S.ville.trim():'Retrait au box')+'\nLocation : '+eur(loc())+(S.mode==='livraison'?' (hors livraison)':'')};
     S.busy=false;render();window.scrollTo(0,0)})
   .catch(function(err){S.busy=false;S.err=/trop de demandes/.test(err.message)?'Beaucoup de demandes en ce moment : réessaie dans un moment, ou écris à Eventys sur WhatsApp.':'L’envoi n’a pas marché. Vérifie ta connexion, ou écris directement à Eventys sur WhatsApp au 07 83 82 56 38.';render()});
}
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
render();
rpc('tarifs_publics').then(function(t){if(t)S.tarifs=t;render()}).catch(function(){});
})();
</script>
</body>
</html>
